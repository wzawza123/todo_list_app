[project]
name = "mdtask"
version = "1.0.0"
description = "MD Task Manager — markdown-backed task manager for Obsidian vaults"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "watchdog>=4.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mdtask = "mdtask.cli:main"
app = "mdtask.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdtask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
